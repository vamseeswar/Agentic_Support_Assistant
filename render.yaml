services:
  - type: web
    name: trendly-support-agent
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_API_KEY
        sync: false # Requires manual entry in Render dashboard
